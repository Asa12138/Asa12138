<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="1200" height="210" role="img" aria-label="Hi, I'm Asa - Bioinformatics PhD and R Package Developer">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#145c56" />
      <stop offset="50%" stop-color="#1f867d" />
      <stop offset="100%" stop-color="#6cc0ad" />
    </linearGradient>
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="50%" stop-color="#d8f5ee" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12" />
    </linearGradient>
    <clipPath id="bannerClip">
      <rect width="1200" height="210" rx="16" ry="16" />
    </clipPath>
    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 46px;
        font-weight: 700;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 18px;
        font-weight: 400;
        fill: #e6f7f4;
        letter-spacing: 0.4px;
      }
      @keyframes drift {
        0%   { transform: translateX(0px); }
        50%  { transform: translateX(-40px); }
        100% { transform: translateX(0px); }
      }
      @keyframes driftSlow {
        0%   { transform: translateX(0px); }
        50%  { transform: translateX(35px); }
        100% { transform: translateX(0px); }
      }
      .wave1 { animation: drift 10s ease-in-out infinite; }
      .wave2 { animation: driftSlow 14s ease-in-out infinite; }
    </style>
  </defs>

  <g clip-path="url(#bannerClip)">
    <!-- Base celadon gradient -->
    <rect width="1200" height="210" fill="url(#bgGrad)" />

    <!-- Subtle bioinformatics hex & network nodes on left & right -->
    <g stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.2" fill="none">
      <polygon points="105,42 132,27 159,42 159,72 132,87 105,72" />
      <polygon points="159,72 186,57 213,72 213,102 186,117 159,102" />
      <polygon points="51,72 78,57 105,72 105,102 78,117 51,102" />
      <line x1="213" y1="87" x2="262" y2="62" />
      <line x1="262" y1="62" x2="300" y2="95" />
      <circle cx="262" cy="62" r="3.5" fill="#ffffff" fill-opacity="0.28" stroke="none" />
      <circle cx="300" cy="95" r="2.5" fill="#ffffff" fill-opacity="0.24" stroke="none" />

      <polygon points="1020,40 1047,25 1074,40 1074,70 1047,85 1020,70" />
      <polygon points="1074,70 1101,55 1128,70 1128,100 1101,115 1074,100" />
      <polygon points="966,70 993,55 1020,70 1020,100 993,115 966,100" />
      <line x1="966" y1="85" x2="915" y2="58" />
      <line x1="915" y1="58" x2="880" y2="96" />
      <circle cx="915" cy="58" r="3.5" fill="#ffffff" fill-opacity="0.28" stroke="none" />
      <circle cx="880" cy="96" r="2.5" fill="#ffffff" fill-opacity="0.24" stroke="none" />
    </g>

    <!-- Soft animated bottom waves -->
    <g class="wave2">
      <path d="M-80,158 C180,120 420,195 700,154 C960,116 1120,175 1300,145 L1300,220 L-80,220 Z" fill="#ffffff" fill-opacity="0.10" />
    </g>
    <g class="wave1">
      <path d="M-60,172 C220,205 460,136 740,172 C980,202 1140,148 1320,170 L1320,220 L-60,220 Z" fill="url(#waveGrad1)" />
    </g>

    <!-- Center Typography -->
    <text x="600" y="92" text-anchor="middle" class="title">Hi, I'm Asa 👋</text>
    <text x="600" y="132" text-anchor="middle" class="subtitle">Bioinformatics PhD · R Package Developer · Microbiome &amp; Omics</text>
  </g>
</svg>
